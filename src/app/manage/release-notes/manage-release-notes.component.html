<div class="manage-release-notes-wrapper">
  <div class="container">
    <div class="page-toolbar">
      <app-breadcrumbs />
    </div>
    <div class="back-row">
      <button mat-button type="button" routerLink="/manage">
        <mat-icon>arrow_back</mat-icon>
        Back
      </button>
    </div>
    <app-page-header icon="new_releases" title="Release Notes" subtitle="What's shipped recently in ShelfSync." zone="insights" />

    <ul class="changelog-list">
      @for (entry of changelogEntries; track entry.title) {
        <li class="changelog-row">
          <span class="changelog-date">{{ entry.date | date: 'MMM d, y' }}</span>
          <span class="changelog-body">
            <span class="semibold">{{ entry.title }}</span>
            <span class="changelog-description">{{ entry.description }}</span>
          </span>
        </li>
      }
    </ul>
  </div>
</div>

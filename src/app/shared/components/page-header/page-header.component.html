<div class="page-header">
  <span class="page-header-icon" [class.page-header-icon-danger]="variant === 'danger'"><mat-icon>{{ icon }}</mat-icon></span>
  <div class="page-header-text">
    <h2>{{ title }}<ng-content select="[headerTitleExtra]" /></h2>
    @if (subtitle) {
      <p class="page-header-subtitle">{{ subtitle }}</p>
    }
  </div>
  <div class="page-header-actions">
    <ng-content />
  </div>
</div>

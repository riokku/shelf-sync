<h2 mat-dialog-title>
  <mat-icon class="order-title-icon">local_shipping</mat-icon>
  Reorder from {{ data.supplierName }}
</h2>
<form [formGroup]="orderForm" (ngSubmit)="submit()">
  <mat-dialog-content>
    <p class="order-item-name">
      <span class="semibold">{{ data.itemName }}</span>
    </p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantity</mat-label>
      <mat-icon matPrefix>numbers</mat-icon>
      <input matInput type="number" min="1" formControlName="quantity" />
      @if (orderForm.controls.quantity.hasError('required')) {
        <mat-error>Quantity is required.</mat-error>
      } @else if (orderForm.controls.quantity.hasError('min')) {
        <mat-error>Quantity must be at least 1.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Note (optional)</mat-label>
      <mat-icon matPrefix>notes</mat-icon>
      <textarea matInput placeholder="Anything worth noting about this order" formControlName="note" rows="2"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">
      <mat-icon>local_shipping</mat-icon>
      Place order
    </button>
  </mat-dialog-actions>
</form>

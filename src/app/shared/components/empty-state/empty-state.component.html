<div class="empty-state" [class.compact]="compact" [class.error]="variant === 'error'" [attr.role]="variant === 'error' ? 'alert' : null">
  @if (compact) {
    <mat-icon class="empty-state-icon">{{ icon }}</mat-icon>
  } @else {
    <span class="empty-state-icon-badge">
      <mat-icon class="empty-state-icon">{{ icon }}</mat-icon>
    </span>
  }
  <p>{{ message }}</p>
  <ng-content></ng-content>
</div>

<nav class="breadcrumb-nav" aria-label="Breadcrumb">
  <a routerLink="/home" class="breadcrumb-link">
    <mat-icon aria-hidden="true">home</mat-icon>
    <span>Home</span>
  </a>
  @if (parent) {
    <span class="breadcrumb-separator">/</span>
    <a [routerLink]="parent.link" class="breadcrumb-link" [title]="parent.label" (click)="parent.onClick?.()">{{ truncate(parent.label) }}</a>
  }
  @if (secondaryParent) {
    <span class="breadcrumb-separator">/</span>
    <a
        [routerLink]="secondaryParent.link"
        class="breadcrumb-link"
        [title]="secondaryParent.label"
        (click)="secondaryParent.onClick?.()"
      >{{ truncate(secondaryParent.label) }}</a>
  }
  @if (secondaryLabel) {
    <span class="breadcrumb-separator">/</span>
    <button
        type="button"
        class="breadcrumb-link breadcrumb-link-button"
        [title]="secondaryLabel"
        (click)="secondaryLabelClick.emit()"
      >{{ truncate(secondaryLabel) }}</button>
  }
  @if (label) {
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-current" [title]="label">{{ truncate(label) }}</span>
  }
</nav>

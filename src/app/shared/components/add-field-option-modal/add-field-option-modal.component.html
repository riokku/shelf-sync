<h2 mat-dialog-title>Add new {{ data.label }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="add-field-option-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ data.label }}</mat-label>
      <input matInput formControlName="value" />
      @if (form.controls.value.hasError('required')) {
        <mat-error>This field is required.</mat-error>
      }
    </mat-form-field>
  </form>

  @if (error) {
    <p class="error-message" role="alert">{{ error }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="isSaving">
    @if (isSaving) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      Add
    }
  </button>
</mat-dialog-actions>

<section class="header-wrapper">
  <a class="brand" routerLink="/home">
    @if (siteSettings.logoUrl(); as logoUrl) {
      <img [src]="logoUrl" alt="Site logo" class="custom-logo" />
    } @else if (themeMode.mode() === 'light') {
      <img src="assets/logo-dark.svg" alt="ShelfSync logo" class="custom-logo" />
    } @else {
      <img src="assets/logo-light.svg" alt="ShelfSync logo" class="custom-logo" />
    }
  </a>
  <nav class="main-nav">
    <a mat-button routerLink="/home" routerLinkActive="active">
      <mat-icon>home</mat-icon>
      Home
    </a>
    <a mat-button routerLink="/inventory" routerLinkActive="active">
      <mat-icon>inventory_2</mat-icon>
      Inventory
    </a>
    <a mat-button routerLink="/tasks" routerLinkActive="active">
      <mat-icon>checklist</mat-icon>
      Tasks
    </a>
    @if (authService.canManage()) {
      <a
          mat-button
          routerLink="/manage"
          routerLinkActive="active"
          [matBadge]="pendingManageCount()"
          [matBadgeHidden]="pendingManageCount() === 0"
          matBadgeColor="warn"
        >
        <mat-icon>admin_panel_settings</mat-icon>
        Manage
      </a>
    }
    @if (authService.role() === 'admin') {
      <a mat-button routerLink="/customize" routerLinkActive="active">
        <mat-icon>palette</mat-icon>
        Customize
      </a>
    }
  </nav>
  <div class="header-actions">
    <button
        mat-icon-button
        type="button"
        class="mode-toggle"
        (click)="themeMode.toggle()"
        [attr.aria-label]="themeMode.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
      <mat-icon>{{ themeMode.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <a mat-button routerLink="/account" routerLinkActive="active">
      <mat-icon>account_circle</mat-icon>
      Account
    </a>
    <button mat-stroked-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </div>
</section>
